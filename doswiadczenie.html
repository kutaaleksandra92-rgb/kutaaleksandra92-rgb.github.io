<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Doświadczenie i CV – Aleksandra Kuta</title>
  <meta name="description" content="Doświadczenie: decyzje produktowe, współpraca z biznesem oraz koordynacja pracy zespołu kreatywnego.">
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css?v=4">
</head>
<body>

  <!-- ============ NAWIGACJA ============ -->
  <header class="site-header">
    <nav class="nav container" aria-label="Główna nawigacja">
      <a href="index.html" class="nav__logo" aria-label="Strona główna">
        <img src="assets/icons/logo.svg" alt="" width="44" height="44">
      </a>

      <button class="nav__toggle" type="button" aria-expanded="false" aria-controls="nav-menu" aria-label="Otwórz menu">
        <img src="assets/icons/menu.svg" alt="" width="24" height="24">
      </button>

      <div class="nav__menu" id="nav-menu">
        <a href="doswiadczenie.html" class="nav__link" aria-current="page">Doświadczenie i CV</a>
        <a href="index.html#rozwoj" class="nav__link">Rozwój i szkolenia</a>
        <a href="index.html#projekty" class="btn btn--cta">
          Wybrane projekty
          <img src="assets/icons/arrow-up-right.svg" alt="" width="24" height="24">
        </a>
      </div>
    </nav>
  </header>

  <main>
    <!-- ============ HEADER ============ -->
    <section class="case-hero cv-hero" aria-labelledby="cv-title">
      <div class="case-hero__content cv-hero__content container">
        <div class="cv-hero__text">
          <p class="cv-hero__eyebrow">Doświadczenie</p>
          <h1 id="cv-title" class="cv-hero__title">Decyzje produktowe, współpraca z biznesem oraz koordynacja pracy zespołu kreatywnego</h1>
        </div>
        <a href="#" class="btn btn--secondary" download>
          Pobierz CV
          <img src="assets/icons/download.svg" alt="" width="24" height="24">
        </a>
      </div>

      <div class="case-hero__media cv-hero__media container">
        <picture>
          <source media="(max-width: 720px)" srcset="assets/images/cv/cv-header-mobile.jpg">
          <img src="assets/images/cv/cv-header.jpg" alt="Aleksandra Kuta podczas pracy z zespołem" width="1200" height="573">
        </picture>
      </div>
    </section>
  </main>

  <script src="js/main.js?v=4"></script>

</html>
